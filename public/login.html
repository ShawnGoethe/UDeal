<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDeal 管理后台 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    .header h1 { font-size: 20px; }
    .header a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
    .header a:hover { color: white; }

    .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .login-card .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-card .logo .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .login-card .logo h2 {
      font-size: 22px;
      color: #333;
      font-weight: 600;
    }

    .login-card .logo p {
      font-size: 14px;
      color: #999;
      margin-top: 6px;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #555; }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }
    .form-group input::placeholder { color: #bbb; }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .login-btn:hover { opacity: 0.92; }
    .login-btn:active { transform: scale(0.99); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .toast {
      position: fixed;
      top: 20px;
      right: -400px;
      background: #e74c3c;
      color: white;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(231,76,60,0.35);
      z-index: 999;
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      max-width: 320px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show { right: 20px; }
    .toast.hide { right: -400px; }

    .footer { text-align: center; padding: 20px; color: #bbb; font-size: 13px; }

    @media (max-width: 480px) {
      .login-card { padding: 28px 24px; }
      .login-card .logo .icon { font-size: 40px; }
      .login-card .logo h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎫 UDeal 管理后台</h1>
    <a href="/">← 返回前台</a>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo">
        <div class="icon">🔐</div>
        <h2>管理员登录</h2>
        <p>请输入账号和密码</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      </form>
    </div>
  </div>

  <div class="footer">UDeal Admin</div>

  <script>
    // Toast notification
    function showToast(msg) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '❌ ' + msg;
      document.body.appendChild(toast);

      // Slide in
      requestAnimationFrame(() => {
        requestAnimationFrame(() => toast.classList.add('show'));
      });

      // Slide out after 3s
      setTimeout(() => {
        toast.classList.remove('show');
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 400);
      }, 3000);
    }

    // If already logged in, redirect to admin
    (async function checkExisting() {
      const token = localStorage.getItem('admin_token');
      if (!token) return;
      try {
        const res = await fetch('/admin/auth/verify', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          window.location.href = '/admin';
        } else {
          localStorage.removeItem('admin_token');
        }
      } catch {}
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const res = await fetch('/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/admin';
        } else {
          showToast(data.message || '登录失败');
        }
      } catch (err) {
        showToast('网络错误，请重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    }
  </script>
</body>
</html>
